name: alfresa_alert_app
description: "Alfresa Alert Monitoring App"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # Logic & Data
  http: ^1.2.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  
  # UI & Maps
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_maps_flutter: ^2.5.0
  fl_chart: ^0.69.0
  
  # ❗ NEW: Notifications
  flutter_local_notifications: ^17.0.0

  # Sound & Vibrate (Optional integration)
  flutter_ringtone_player: ^3.2.0
  vibration: ^1.8.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
    - assets/images/alfresa_logo.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600